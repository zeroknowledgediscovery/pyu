name: Assemble public analysis package

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source and model bundles
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/source_bundle.b64 > /tmp/pyu-source.tar.gz
          tar -xzf /tmp/pyu-source.tar.gz -C .
          base64 -d bootstrap/model_bundle.b64 > /tmp/pyu-models.tar.gz
          tar -xzf /tmp/pyu-models.tar.gz -C .
          gunzip -f models/lightgbm_final.txt.gz
          for d in 00 01 02 03; do
            tar -xzf "models/model_depth_${d}_runtime.tar.gz" -C models
            rm "models/model_depth_${d}_runtime.tar.gz"
            mv "models/model_depth_${d}" "models/lsm_depth_${d}"
          done
          rm -rf bootstrap

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn lightgbm matplotlib zedstat

      - name: Render aggregate figures
        run: |
          python scripts/make_publication_figures.py

      - name: Compile brief PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          cd results
          pdflatex -interaction=nonstopmode -halt-on-error brief.tex
          pdflatex -interaction=nonstopmode -halt-on-error brief.tex
          rm -f brief.aux brief.log brief.out

      - name: Verify no patient-level data were staged
        shell: bash
        run: |
          set -euo pipefail
          if find data -type f ! -name README.md | grep -q .; then
            echo "Unexpected file under data/" >&2
            exit 1
          fi
          if git status --short | grep -E 'pyuria_longitudinal_safe|split_patients|Anon_MRN|Anon_Encounter' ; then
            echo "Potential patient-level artifact detected" >&2
            exit 1
          fi

      - name: Commit assembled package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble models, figures, and performance report" || exit 0
          git push
